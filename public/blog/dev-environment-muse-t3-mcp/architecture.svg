<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif">
  <title id="t">Dev environment architecture</title>
  <desc id="d">hatai briefs Muse on a Linux VM. Muse connects via the T3 Connect MCP relay to T3 Code on a home Windows/WSL machine, where a thread works in a worktree and pushes a GitHub PR. A dashed lower lane shows a planned route: Grok Bot and Muse posting to a shared MCP message board hosted on the home machine via Tailscale Funnel.</desc>
  <style>
    .box { fill: none; stroke: #c8c4ba; stroke-width: 1.5; }
    .acc { fill: none; stroke: #9a3412; stroke-width: 1.5; }
    .wip { stroke-dasharray: 5 4; }
    .ln  { stroke: #a8a49a; stroke-width: 1.5; fill: none; }
    .fg  { fill: #1c1b18; }
    .mut { fill: #6f6c66; }
    .mf  { fill: #a8a49a; }
    @media (prefers-color-scheme: dark) {
      .box { stroke: #45423c; }
      .acc { stroke: #fb923c; }
      .ln  { stroke: #6f6c66; }
      .fg  { fill: #e9e7e2; }
      .mut { fill: #a09d95; }
      .mf  { fill: #6f6c66; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" class="mf"/>
    </marker>
  </defs>

  <!-- main lane -->
  <rect class="box" x="24" y="96" width="76" height="56" rx="8"/>
  <text class="fg" x="62" y="130" font-size="15" font-weight="600" text-anchor="middle">hatai</text>
  <path class="ln" d="M100,124 L136,124" marker-end="url(#arrow)"/>
  <text class="mut" x="118" y="110" font-size="10.5" text-anchor="middle">brief</text>

  <rect class="box" x="140" y="88" width="140" height="72" rx="8"/>
  <text class="fg" x="210" y="120" font-size="15" font-weight="600" text-anchor="middle">Muse</text>
  <text class="mut" x="210" y="140" font-size="11.5" text-anchor="middle">personal agent · Linux VM</text>
  <path class="ln" d="M280,124 L316,124" marker-end="url(#arrow)"/>
  <text class="mut" x="298" y="110" font-size="10.5" text-anchor="middle">MCP</text>

  <rect class="box" x="320" y="88" width="170" height="72" rx="8"/>
  <text class="fg" x="405" y="118" font-size="13.5" font-weight="600" text-anchor="middle">T3 Connect relay</text>
  <text class="mut" x="405" y="140" font-size="11" text-anchor="middle">MCP endpoint · OAuth</text>
  <path class="ln" d="M490,124 L526,124" marker-end="url(#arrow)"/>
  <text class="mut" x="508" y="110" font-size="10.5" text-anchor="middle">MCP</text>

  <rect class="acc" x="530" y="48" width="250" height="150" rx="10"/>
  <text class="mut" x="655" y="72" font-size="11.5" text-anchor="middle">Home PC · Windows + WSL (Ubuntu)</text>
  <rect class="box" x="550" y="96" width="100" height="52" rx="8"/>
  <text class="fg" x="600" y="127" font-size="13" font-weight="600" text-anchor="middle">T3 Code</text>
  <path class="ln" d="M650,122 L666,122" marker-end="url(#arrow)"/>
  <rect class="box" x="670" y="96" width="110" height="52" rx="8"/>
  <text class="mut" x="725" y="116" font-size="10.5" text-anchor="middle">T3 thread</text>
  <text class="fg" x="725" y="136" font-size="13" font-weight="600" text-anchor="middle">worktree</text>

  <path class="ln" d="M780,124 L816,124" marker-end="url(#arrow)"/>
  <text class="mut" x="798" y="110" font-size="10.5" text-anchor="middle">push</text>
  <rect class="acc" x="820" y="96" width="92" height="56" rx="8"/>
  <text class="fg" x="866" y="130" font-size="13" font-weight="600" text-anchor="middle">GitHub PR</text>

  <!-- planned lane -->
  <rect class="box wip" x="60" y="272" width="140" height="64" rx="8"/>
  <text class="fg" x="130" y="308" font-size="14" font-weight="600" text-anchor="middle">Grok Bot</text>
  <path class="ln wip" d="M200,304 L244,304" marker-end="url(#arrow)"/>
  <text class="mut" x="222" y="290" font-size="10.5" text-anchor="middle">MCP</text>

  <rect class="box wip" x="250" y="264" width="200" height="80" rx="8"/>
  <text class="fg" x="350" y="296" font-size="14" font-weight="600" text-anchor="middle">Agent Intercom</text>
  <text class="mut" x="350" y="316" font-size="11" text-anchor="middle">MCP message board</text>
  <text class="mut" x="350" y="334" font-size="10.5" text-anchor="middle">in progress</text>

  <path class="ln wip" d="M210,160 L210,230 L375,230 L375,258" marker-end="url(#arrow)"/>
  <text class="mut" x="288" y="220" font-size="10.5" text-anchor="middle">MCP</text>

  <path class="ln wip" d="M450,304 L612,304 L612,204" marker-end="url(#arrow)"/>
  <text class="mut" x="620" y="250" font-size="11" text-anchor="start">Tailscale Funnel</text>
  <text class="mut" x="620" y="266" font-size="10" text-anchor="start">(planned)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Task flow in owner lanes: Human, Conductor Grok Bot, Implementation GLM, Review Codex, Merge queue Kodiak">
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; }
    .fg { fill: #1c1b18; }
    .muted { fill: #6f6c66; }
    .box { fill: #fbfaf8; stroke: #d8d5cd; }
    .gate { fill: #fbfaf8; stroke: #9a3412; stroke-width: 1.8; }
    .edge { stroke: #b6b2a8; fill: none; }
    .edgeDash { stroke: #9a3412; fill: none; stroke-dasharray: 5 4; }
    .lane { stroke: #e5e2db; fill: none; }
    .accent { fill: #9a3412; }
    .ahead { fill: #9a3412; }
    .arrowFill { fill: #b6b2a8; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e9e7e2; }
      .muted { fill: #a09d95; }
      .box { fill: #1a1a18; stroke: #3a3935; }
      .gate { fill: #1a1a18; stroke: #fb923c; }
      .edge { stroke: #5b5952; }
      .edgeDash { stroke: #fb923c; }
      .lane { stroke: #2a2926; }
      .accent, .ahead { fill: #fb923c; }
      .arrowFill { fill: #5b5952; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrowFill"/>
    </marker>
    <marker id="arrHot" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ahead"/>
    </marker>
  </defs>

  <!-- lanes -->
  <line x1="0" y1="8" x2="1000" y2="8" class="lane"/>
  <line x1="0" y1="68" x2="1000" y2="68" class="lane"/>
  <line x1="0" y1="128" x2="1000" y2="128" class="lane"/>
  <line x1="0" y1="188" x2="1000" y2="188" class="lane"/>
  <line x1="0" y1="248" x2="1000" y2="248" class="lane"/>
  <line x1="0" y1="308" x2="1000" y2="308" class="lane"/>
  <line x1="112" y1="8" x2="112" y2="308" class="lane"/>

  <!-- lane labels -->
  <text x="12" y="34" font-size="12" class="fg">Human</text>
  <text x="12" y="47" font-size="9.5" class="muted">decisions</text>
  <text x="12" y="94" font-size="12" class="fg">Conductor</text>
  <text x="12" y="107" font-size="9.5" class="muted">Grok Bot</text>
  <text x="12" y="154" font-size="12" class="fg">Implement</text>
  <text x="12" y="167" font-size="9.5" class="muted">GLM</text>
  <text x="12" y="214" font-size="12" class="fg">Review</text>
  <text x="12" y="227" font-size="9.5" class="muted">Codex</text>
  <text x="12" y="272" font-size="11" class="fg">Merge queue</text>
  <text x="12" y="285" font-size="9.5" class="muted">Kodiak</text>

  <!-- arrows -->
  <line x1="290" y1="92" x2="306" y2="58" class="edge" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="50" x2="476" y2="76" class="edge" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="106" x2="676" y2="138" class="edge" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="780" y1="180" x2="780" y2="190" class="edge" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 682 240 C 642 240 640 142 682 142" class="edgeDash" stroke-width="1.5" marker-end="url(#arrHot)"/>
  <line x1="880" y1="240" x2="868" y2="260" class="edge" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="925" y1="258" x2="925" y2="60" class="edge" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- arrow labels -->
  <text x="790" y="188" font-size="10" class="muted">PR</text>
  <text x="636" y="195" text-anchor="end" font-size="10.5" class="accent">changes</text>

  <!-- nodes -->
  <rect x="130" y="80" width="160" height="36" rx="8" class="box"/>
  <text x="210" y="96" text-anchor="middle" font-size="12" class="fg">File &amp; split issues</text>
  <text x="210" y="109" text-anchor="middle" font-size="10" class="muted">(sub-issues)</text>

  <rect x="310" y="20" width="150" height="36" rx="8" class="gate"/>
  <text x="385" y="36" text-anchor="middle" font-size="12" class="fg">ready-for-agent</text>
  <text x="385" y="49" text-anchor="middle" font-size="10" font-weight="600" class="accent">start decision</text>

  <rect x="480" y="80" width="170" height="36" rx="8" class="box"/>
  <text x="565" y="102" text-anchor="middle" font-size="12" class="fg">Dispatch to GLM thread</text>

  <rect x="680" y="136" width="200" height="44" rx="8" class="box"/>
  <text x="780" y="155" text-anchor="middle" font-size="12" class="fg">Implement in a worktree</text>
  <text x="780" y="170" text-anchor="middle" font-size="10" class="muted">fixed-format implementer memo</text>

  <rect x="680" y="192" width="200" height="52" rx="8" class="box"/>
  <text x="780" y="209" text-anchor="middle" font-size="12" class="fg">Codex reviews</text>
  <text x="780" y="223" text-anchor="middle" font-size="10" class="muted">model/effort set by PR contents</text>
  <text x="780" y="237" text-anchor="middle" font-size="10" class="muted">Claude on high-risk + samples</text>

  <rect x="860" y="258" width="130" height="40" rx="8" class="box"/>
  <text x="925" y="275" text-anchor="middle" font-size="11" class="fg">Wait for CI,</text>
  <text x="925" y="290" text-anchor="middle" font-size="11" class="fg">merge in order</text>

  <rect x="860" y="20" width="130" height="36" rx="8" class="gate"/>
  <text x="925" y="43" text-anchor="middle" font-size="12" font-weight="600" class="accent">Merge</text>
</svg>

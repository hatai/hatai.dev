jobs:
  - company:
      en: iCARE, Inc. — Carely (healthcare SaaS)
      ja: 株式会社iCARE — Carely(健康管理SaaS)
    role:
      en: Full-Stack Engineer / Tech Lead (PL/PM)
      ja: フルスタックエンジニア / テックリード(PL/PM)
    period:
      en: Nov 2022 – Present
      ja: 2022年11月 – 現在
    location:
      en: Tokyo, Japan
      ja: 東京
    stack: Vue.js, Ruby on Rails, Python, FastAPI, LangChain/LangGraph, AWS, PostgreSQL
    highlights:
      en:
        - 4,574 commits and 851 merged PRs across the main SaaS and the AI-OCR platform. One of the primary engineers on the LLM document-recognition service, with 976 commits and 116 merged PRs.
        - 'Built the production LLM pipeline (Jan 2025 – Apr 2026). A FastAPI + LangChain v1/LangGraph multi-agent setup that extracts exam items, values, units, and judgments as structured data. Covers model switching (Claude, GPT, Gemini, Mistral), an async task queue (Taskiq + PostgreSQL), HMAC-signed webhooks, and JWT auth.'
        - 'Built the LLM evaluation stack. A dedicated CLI runs golden-dataset experiments on Langfuse (observation-, user-, and session-level scores, plus trace costs). Before switching defaults, shadow deployments compared candidate models on live traffic.'
        - 'Led a dedicated AI-OCR R&D phase (Oct 2024 – Oct 2025): evaluated models and approaches on real documents, then designed and built the production pipeline.'
        - Health-checkup features on the main SaaS (300+ commits), including LLM-based ingestion of scanned checkup results.
        - 'Designed a configurable rules engine for health conditions (e.g., metabolic syndrome criteria) that later features reused.'
        - 'Vue 2 → Vue 3 migration: eliminated hundreds of typing errors across shared components, fixtures, and GraphQL codegen layers (single PRs removing 273, 83, and 42 errors).'
        - 'PII data masking for staging environments: audited the full masking policy and applied RFC 2606 reserved domains, credential redaction, and outbound-mail suppression.'
        - 'Release engineering and observability for the OCR service: build-once CI/CD cut image builds from 17 minutes to under 5. Added automated rollback, Datadog APM dashboards, and retry instrumentation for queue workers.'
        - 'Developer platform (2026): led a 9-part RSpec optimization of the Carely monorepo — CircleCI Gen2, test-suite splitting, and auto-rerun cut suite runtimes by up to ~40%.'
        - 'Migrated frontend linting to type-aware oxlint and upgraded Bundler to 4.'
        - 'Engineering enablement: rolled out Claude Code workflows, Agent Skills and custom sub-agents, CLAUDE.md coding rules, Cursor Cloud Agent environments, and CI merge gates to the whole engineering team.'
      ja:
        - 本体SaaSとAI-OCRプラットフォームで計4,574コミット・851本のマージPR。LLM文書認識サービスでは主要エンジニアの一人として976コミット・116本を担当した。
        - '本番LLMパイプラインを構築した(2025年1月〜2026年4月)。FastAPI + LangChain v1/LangGraphのマルチエージェント構成で、健診項目・値・単位・判定を構造化して抽出。複数モデル(Claude、GPT、Gemini、Mistral)の切り替え、非同期タスクキュー(Taskiq + PostgreSQL)、HMAC署名付きWebhook、JWT認証までを含む。'
        - 'LLM評価基盤を構築。Langfuseでゴールデンデータセット実験(観測・ユーザー・セッション単位のスコア、トレースコスト)を回す専用CLIを作った。デフォルト切替前は、候補モデルを実トラフィックで比較するシャドウデプロイで判断した。'
        - AI OCRのR&D専任フェーズ(2024年10月〜2025年10月)を主導。実際のドキュメントでモデルと方式を評価し、その結果を本番パイプラインの設計・実装につなげた。
        - '本体SaaSの健康診断機能を担当(300+コミット)。スキャンされた健診結果をLLMで取り込む機能を実装した。'
        - '健康状態を判定する設定可能なルールエンジン(メタボリックシンドローム基準など)を設計。他の機能にも再利用された。'
        - 'Vue 2からVue 3への移行。共有コンポーネントやフィクスチャ、GraphQLコード生成層にまたがる数百件の型エラーを解消した(単一PRで273件、83件、42件の削減)。'
        - 'ステージング環境のPIIデータマスキング。マスキングポリシー全体を監査し、RFC 2606の予約ドメイン、認証情報のリダクション、送信メールの抑制を適用した。'
        - 'OCRサービスのリリースエンジニアリングと監視。build-once CI/CDでイメージビルドを17分から5分未満に短縮し、自動ロールバック、Datadog APMダッシュボード、キューワーカーのリトライ計装を整えた。'
        - '開発基盤(2026年)。CarelyモノリスのRSpec高速化を9分割のプロジェクトとして主導し、CircleCI Gen2への移行とテスト分割、自動リランでスイート実行時間を最大約40%短縮した。'
        - 'フロントエンドのlintをtype-awareなoxlintへ移行し、Bundlerを4にアップグレードした。'
        - 'エンジニアリング支援。Claude Codeワークフロー、Agent Skills、カスタムサブエージェント、CLAUDE.mdのコーディングルール、Cursor Cloud Agent環境、CIマージゲートを開発チーム全体に展開した。'

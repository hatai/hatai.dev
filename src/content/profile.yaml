jobs:
  - company:
      en: iCARE, Inc. — Carely (healthcare SaaS)
      ja: 株式会社iCARE — Carely(健康管理SaaS)
    role:
      en: Full-Stack Engineer / Tech Lead (PL/PM)
      ja: フルスタックエンジニア / テックリード(PL/PM)
    period:
      en: Nov 2022 – Present
      ja: 2022年11月 – 現在
    location:
      en: Tokyo, Japan
      ja: 東京
    stack: Vue.js, Ruby on Rails, Python, FastAPI, LangChain/LangGraph, AWS, PostgreSQL
    highlights:
      en:
        - 4,574 commits / 851 merged PRs across the main SaaS and the AI-OCR platform — one of the primary engineers on the LLM document-recognition service (976 commits / 116 merged PRs).
        - 'Built the production LLM pipeline (Jan 2025 – Apr 2026): FastAPI + LangChain v1 / LangGraph multi-agent orchestration, multi-model support (Claude, GPT, Gemini, Mistral), structured extraction of exam items/values/units/judgments, async task queue (Taskiq + PostgreSQL), HMAC-signed webhooks, S3/MinIO storage, JWT auth.'
        - 'Built the LLM evaluation stack: golden-dataset experiments on Langfuse (observation/user/session-level scores, trace costs) with dedicated CLI tooling; shadow deployments comparing candidate models on live traffic before switching defaults.'
        - 'Led a dedicated AI OCR R&D phase (Oct 2024 – Oct 2025): evaluated models and approaches on real-world documents, then designed and shipped the production pipeline.'
        - 'Health-checkup features on the main SaaS (300+ commits): LLM-based ingestion of scanned checkup results; designed a configurable rules engine for health conditions (e.g., metabolic syndrome criteria) that later features reused.'
        - 'Vue 2 → Vue 3 migration: eliminated hundreds of typing errors across shared components, fixtures, and GraphQL codegen layers (single PRs removing 273 / 83 / 42 errors).'
        - 'PII data masking for staging environments: full masking-policy audit, RFC 2606 reserved domains, credential redaction, outbound-mail suppression.'
        - 'Release engineering and observability for the OCR service: build-once CI/CD (image builds 17 min → under 5 min), automated rollback workflows, Datadog APM dashboards, and retry instrumentation for queue workers.'
        - 'Developer platform (2026): led a 9-part RSpec optimization of the Carely monorepo — CircleCI Gen2, test-suite splitting, auto-rerun, suite runtimes down up to ~40%; migrated frontend linting to type-aware oxlint and upgraded Bundler to 4.'
        - 'Engineering enablement: Claude Code workflows, Agent Skills and custom sub-agents, CLAUDE.md coding rules, Cursor Cloud Agent environments, and CI merge gates — rolled out to the entire engineering team.'
      ja:
        - 本体SaaSとAI-OCRプラットフォームで計4,574コミット / マージPR 851本 — LLM文書認識サービスでは主要エンジニアの一人として976コミット / 116本のマージPRを担当。
        - '本番LLMパイプラインを構築(2025年1月〜2026年4月): FastAPI + LangChain v1 / LangGraphによるマルチエージェントオーケストレーション、マルチモデル対応(Claude、GPT、Gemini、Mistral)、健診項目・値・単位・判定の構造化抽出、非同期タスクキュー(Taskiq + PostgreSQL)、HMAC署名付きWebhook、S3/MinIOストレージ、JWT認証。'
        - 'LLM評価基盤を構築: Langfuseでのゴールデンデータセット実験(観測/ユーザー/セッション単位のスコア、トレースコスト)と専用CLIツールを整備。デフォルト切替前に実トラフィックで候補モデルを比較するシャドウデプロイを運用。'
        - AI OCRのR&D専任期間(2024年10月〜2025年10月)を主導。実ドキュメントでモデル・方式を評価し、本番パイプラインを設計・実装。
        - '本体SaaSの健康診断機能(300+コミット): スキャンされた健診結果をLLMで取り込む機能を実装。健康状態判定の設定可能なルールエンジン(メタボリックシンドローム基準など)を設計し、他機能にも再利用。'
        - 'Vue 2 → Vue 3移行: 共有コンポーネント、フィクスチャ、GraphQLコード生成層にわたる数百件の型エラーを解消(単一PRで273 / 83 / 42件を削減)。'
        - 'ステージング環境向けPIIデータマスキング: マスキングポリシー全体の監査、RFC 2606予約ドメイン、認証情報のリダクション、送信メール抑制。'
        - 'OCRサービスのリリースエンジニアリングとオブザーバビリティ: build-once CI/CD(イメージビルド17分→5分未満)、自動ロールバックワークフロー、Datadog APMダッシュボード、キューワーカーのリトライ計装を整備。'
        - '開発基盤(2026年): CarelyモノリスのRSpec高速化を9分割で主導 — CircleCI Gen2、テスト分割、自動リランによりスイート実行時間を最大約40%短縮。フロントエンドのlintをtype-awareなoxlintへ移行し、Bundlerを4へアップグレード。'
        - 'エンジニアリング支援: Claude Codeワークフロー、Agent Skillsとカスタムサブエージェント、CLAUDE.mdコーディングルール、Cursor Cloud Agent環境、CIマージゲートを開発チーム全体に展開。'

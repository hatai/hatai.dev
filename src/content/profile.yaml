summary:
  en: 'Full-stack engineer who has spent 10 years building production web services, centered on healthcare SaaS — including POS, video streaming, and reservation platforms. Now a tech lead covering everything from design and implementation to CI/CD, and shipped LLM document extraction together with its evaluation stack to production. Uses coding agents such as Claude Code, Codex, and Devin every day, and is also working on development workflows that orchestrate multiple agents.'
  ja: ヘルスケアSaaSを中心に、POS、動画配信、予約プラットフォームなど、本番のWebサービスを10年作ってきたフルスタックエンジニア。いまはテックリードとして設計から実装、CI/CDまでを担い、LLMの文書抽出と評価基盤を本番投入した。Claude CodeやCodex、Devinといったコーディングエージェントを毎日使い、複数エージェントを束ねる開発フローの構築にも取り組んでいる。
highlights:
  en:
    - Shipped LLM document extraction to production at a healthcare SaaS, replacing a legacy OCR pipeline with much higher accuracy. FastAPI + LangChain v1/LangGraph multi-agent setup with switchable models (Claude, GPT, Gemini, Mistral).
    - 'Built the LLM evaluation stack: a dedicated CLI for golden-dataset experiments on Langfuse (scores, trace costs), and shadow deployments that compared candidate models on live traffic before switching defaults.'
    - 'Release engineering: rebuilt CI/CD around a build-once model and cut image builds from 17 minutes to under 5. Added automated rollback and reusable deploy workflows for QA/staging/prod.'
    - 'Test infrastructure: led a 9-part RSpec optimization on a 100k+-commit Rails/Vue monorepo. CircleCI Gen2, test-suite splitting, and auto-rerun cut suite runtimes by up to ~40%.'
    - Daily production user of Claude Code, Cursor, GitHub Copilot, Codex, and Devin — reviewing and fixing AI-generated code is part of normal work. Packaged the know-how into agent skills (LangChain, Langfuse, FastAPI, Terraform, optimize-rspec) and custom sub-agents for the engineering team.
    - 'Spec-driven development: write thorough design docs and context first, so coding agents produce the intended result on the first pass.'
  ja:
    - ヘルスケアSaaSでLLM文書抽出を本番投入。既存OCRパイプラインを置き換え、精度を大幅に向上させた。FastAPI + LangChain v1/LangGraphのマルチエージェント構成で、複数モデル(Claude、GPT、Gemini、Mistral)を切り替えられる。
    - 'LLM評価基盤を構築。Langfuseのゴールデンデータセット実験(スコア・トレースコスト)を回す専用CLIを整備し、デフォルト切替前に候補モデルを実トラフィックで比較するシャドウデプロイを運用した。'
    - 'リリースエンジニアリング。CI/CDをbuild-onceモデルに作り替え、イメージビルドを17分から5分未満に短縮。自動ロールバックと再利用可能なデプロイワークフロー(QA/staging/prod)も整備した。'
    - 'テスト基盤。10万コミット超のRails/Vueモノリスで、9分割のRSpec高速化プロジェクトを主導。CircleCI Gen2への移行とテスト分割、自動リランでスイート実行時間を最大約40%短縮した。'
    - Claude Code、Cursor、GitHub Copilot、Codex、Devinを業務で毎日使い、AI生成コードのレビューと修正を日常業務にしている。ノウハウはエージェントスキル(LangChain、Langfuse、FastAPI、Terraform、optimize-rspec)とカスタムサブエージェントにまとめ、開発チームに展開した。
    - 'スペック駆動開発。設計ドキュメントとコンテキストを十分に書いてから実装させることで、コーディングエージェントが一度で意図した成果物を出せる状態を作る。'

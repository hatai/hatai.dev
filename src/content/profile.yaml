summary:
  en: 'Full-stack software engineer with 10 years of experience building production web services end-to-end — POS systems, real-time video streaming, reservation platforms, and healthcare SaaS. AI-native: uses Claude Code, Cursor, GitHub Copilot, Codex, and Devin daily in production work, and shipped an OCR→LLM document-extraction migration together with its Langfuse-based evaluation stack. Tech lead (PL/PM) and hands-on engineer on teams of 3–6.'
  ja: POSシステム、リアルタイム動画配信、予約プラットフォーム、ヘルスケアSaaSなど、プロダクションのWebサービスをEnd-to-Endで構築してきたフルスタックエンジニア(経験10年)。Claude Code、Cursor、GitHub Copilot、Codex、Devinを毎日業務で使うAIネイティブな開発者。OCR→LLMへの文書抽出移行と、Langfuseによる評価基盤を本番投入した。3〜6名チームでテックリード(PL/PM)と実装を兼任。
highlights:
  en:
    - Shipped LLM-based document extraction to production at a healthcare SaaS — replaced a legacy OCR pipeline with substantially higher accuracy. FastAPI + LangChain v1/LangGraph multi-agent orchestration with multi-model support (Claude, GPT, Gemini, Mistral), async task-queue workers, and HMAC-signed webhooks on AWS.
    - 'Built the LLM evaluation stack: golden-dataset experiments on Langfuse (observation/user/session-level scores, trace costs) with dedicated CLI tooling, plus shadow deployments comparing candidate models on live traffic before switching defaults.'
    - 'Release engineering: rebuilt container CI/CD around a build-once model — prebuilt base images plus an ECR registry cache cut image builds from 17 minutes to under 5; added automated rollback and reusable deploy workflows (QA/staging/prod).'
    - 'Test infrastructure: led a 9-part RSpec optimization project on a 100k+-commit Rails/Vue monorepo (CircleCI Gen2, test-suite splitting, auto-rerun) — individual suite runtimes cut by up to ~40%.'
    - Daily production user of Claude Code, Cursor, GitHub Copilot, Codex, and Devin — reviews and corrects AI-generated code as part of normal work; distilled the know-how into agent skills (LangChain, Langfuse, FastAPI, Terraform, optimize-rspec) and custom sub-agents shared across the engineering team.
    - 'Spec-driven development: write thorough design docs and context so coding agents deliver the intended result on the first pass.'
  ja:
    - ヘルスケアSaaSでLLM文書抽出を本番投入 — 既存OCRパイプラインを置き換え、精度を大幅に向上。FastAPI + LangChain v1/LangGraphによるマルチエージェントオーケストレーション、マルチモデル対応(Claude、GPT、Gemini、Mistral)、非同期タスクキューワーカー、HMAC署名付きWebhookをAWS上で設計・運用。
    - 'LLM評価基盤を構築: Langfuseでのゴールデンデータセット実験(観測/ユーザー/セッション単位のスコア、トレースコスト)と専用CLIツール、デフォルト切替前に実トラフィックで候補モデルを比較するシャドウデプロイを運用。'
    - 'リリースエンジニアリング: build-onceモデルへのCI/CD再構築。ベースイメージ事前ビルドとECRレジストリキャッシュでイメージビルドを17分→5分未満に短縮し、自動ロールバックとQA/staging/prod共通の再利用可能なデプロイワークフローを整備。'
    - 'テスト基盤: 10万コミット超のRails/Vueモノリスで9分割のRSpec高速化プロジェクトを主導(CircleCI Gen2、テスト分割、自動リラン)。スイート単位の実行時間を最大約40%短縮。'
    - Claude Code、Cursor、GitHub Copilot、Codex、Devinを業務で毎日使用し、AI生成コードのレビュー・修正を日常的に実施。ノウハウをエージェントスキル(LangChain、Langfuse、FastAPI、Terraform、optimize-rspec)とカスタムサブエージェントとして整理し、開発チーム全体に展開。
    - 'スペック駆動開発: 設計ドキュメントとコンテキストを丁寧に整備し、コーディングエージェントが一発で意図した成果物を出すための実践。'
